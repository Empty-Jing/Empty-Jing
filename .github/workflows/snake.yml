name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%238B5CF6&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%23A78BFA,%237C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%23161B22,%23312E81,%234C1D95,%236D28D9,%238B5CF6

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
