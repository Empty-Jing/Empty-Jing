<svg xmlns="http://www.w3.org/2000/svg" width="720" height="54" viewBox="0 0 720 54" role="img" aria-labelledby="title">
  <title id="title">My name is Empty Jing and I build useful things</title>
  <rect x="2" y="2" width="716" height="50" rx="2" fill="#fff36a" stroke="#111" stroke-width="4"/>
  <text x="360" y="35" text-anchor="middle" fill="#111" font-family="sans-serif" font-size="22" font-weight="700">My name is Empty Jing — I build useful things</text>
  <circle cx="22" cy="27" r="6" fill="#00a651">
    <animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="698" cy="27" r="6" fill="#00a651">
    <animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
