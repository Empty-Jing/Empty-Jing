<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Empty-Jing system profile</title>
  <desc id="desc">Cyberpunk terminal interface for an AI and automation developer</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset=".55" stop-color="#090b18"/>
      <stop offset="1" stop-color="#100820"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f5d4"/>
      <stop offset=".48" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18d8c0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H1200" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="18" y="18" width="1164" height="384" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#frameClip)">
    <rect x="18" y="18" width="1164" height="384" fill="url(#grid)"/>
    <rect x="18" y="18" width="1164" height="384" fill="url(#scan)"/>
    <path d="M18 108H184L210 82H460" fill="none" stroke="#00f5d4" stroke-opacity=".35"/>
    <path d="M1182 302H1015L986 331H805" fill="none" stroke="#b026ff" stroke-opacity=".42"/>
    <circle cx="210" cy="82" r="3" fill="#00f5d4" filter="url(#softGlow)"/>
    <circle cx="986" cy="331" r="3" fill="#b026ff" filter="url(#softGlow)"/>

    <rect x="18" y="18" width="1164" height="50" fill="#080d17" fill-opacity=".92"/>
    <circle cx="48" cy="43" r="6" fill="#ff4d6d"/>
    <circle cx="70" cy="43" r="6" fill="#ffd166"/>
    <circle cx="92" cy="43" r="6" fill="#00f5d4"/>
    <text x="120" y="49" fill="#718096" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.5">EMPTY-JING // SYSTEM_PROFILE</text>
    <circle cx="1052" cy="43" r="5" fill="#00f5d4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1068" y="49" fill="#00f5d4" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1">ONLINE</text>

    <text x="72" y="139" fill="#526071" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15">01 / IDENTITY</text>
    <text x="68" y="211" fill="url(#neon)" filter="url(#softGlow)" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-weight="800" font-size="67" letter-spacing="5">EMPTY_JING</text>
    <rect x="70" y="230" width="566" height="2" fill="url(#neon)" opacity=".85"/>
    <text x="72" y="270" fill="#d8e2f0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="20" letter-spacing="2">AI SYSTEMS / PYTHON / AUTOMATION</text>

    <text x="72" y="318" fill="#00f5d4" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16">$</text>
    <text x="94" y="318" fill="#9aa8ba" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16">build --useful --simple --ship</text>
    <rect x="398" y="303" width="10" height="19" fill="#b026ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="350" fill="#65758b" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14">[ OK ] turning ideas into working software</text>

    <g transform="translate(895 215)">
      <circle r="106" fill="none" stroke="#273247" stroke-width="1"/>
      <circle r="82" fill="#090d18" stroke="url(#neon)" stroke-width="2" filter="url(#softGlow)"/>
      <circle r="60" fill="none" stroke="#00f5d4" stroke-opacity=".2" stroke-dasharray="4 7"/>
      <path d="M-126 0H-91M91 0H126M0-126V-91M0 91V126" stroke="#36bcf7" stroke-opacity=".7"/>
      <circle cx="0" cy="-106" r="4" fill="#b026ff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text y="12" text-anchor="middle" fill="#e8f4ff" filter="url(#softGlow)" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="48" font-weight="700" letter-spacing="4">EJ</text>
      <text y="40" text-anchor="middle" fill="#63728a" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="3">CORE_01</text>
    </g>

    <rect x="18" y="374" width="1164" height="28" fill="#080d17" fill-opacity=".94"/>
    <text x="38" y="393" fill="#526071" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5">GITHUB://EMPTY-JING</text>
    <text x="1030" y="393" fill="#526071" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5">BUILD 2026.07</text>

    <rect x="18" y="-25" width="1164" height="2" fill="#36bcf7" opacity=".25">
      <animate attributeName="y" values="-25;425" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="18" y="18" width="1164" height="384" rx="10" fill="none" stroke="url(#neon)" stroke-opacity=".5"/>
  <path d="M18 42V28Q18 18 28 18H92M1182 378V392Q1182 402 1172 402H1108" fill="none" stroke="#00f5d4" stroke-width="2" filter="url(#softGlow)"/>
</svg>
